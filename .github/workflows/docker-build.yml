# GitHub Actions：构建并推送 Docker 镜像到 GitHub Container Registry
name: 构建Docker镜像

on:
  # 推送到 main 分支时触发
  push:
    branches: [main, master]
  # 手动触发
  workflow_dispatch:

env:
  # GitHub Container Registry 镜像名
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/leeQ

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      # 1. 拉取代码
      - name: 拉取代码
        uses: actions/checkout@v4

      # 2. 登录 GitHub Container Registry
      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 3. 构建并推送 Docker 镜像
      - name: 构建并推送
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max